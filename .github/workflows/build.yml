# Compila y prueba las apps en cada push. iOS solo puede compilarse en macOS: por eso va en la nube.
name: build

on:
  push:
  pull_request:

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with: { distribution: temurin, java-version: "21" }
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew :shared:compileCommonMainKotlinMetadata :shared:jvmTest :shared:jsNodeTest :shared:jsBrowserProductionLibraryDistribution :androidApp:assembleDebug --console=plain
      - run: npm ci && npm run build  # la versión web, con el núcleo recién compilado
        working-directory: web
      - uses: actions/upload-artifact@v7
        with:
          name: trainsync-debug-apk
          path: androidApp/build/outputs/apk/debug/*.apk

  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with: { distribution: temurin, java-version: "21" }
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew :shared:iosSimulatorArm64Test --console=plain
      - run: brew install xcodegen
      - working-directory: iosApp
        run: |
          xcodegen
          xcodebuild -project iosApp.xcodeproj -scheme iosApp -sdk iphonesimulator -derivedDataPath build \
            -destination 'generic/platform=iOS Simulator' build CODE_SIGNING_ALLOWED=NO
      # Capturas en el simulador para revisar la interfaz de iOS sin un Mac
      - working-directory: iosApp
        run: |
          DEVICE=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print(next(x['udid'] for k in sorted(d, reverse=True) if 'iOS' in k for x in d[k] if x['name'].startswith('iPhone')))")
          xcrun simctl boot "$DEVICE"
          xcrun simctl bootstatus "$DEVICE" -b
          xcrun simctl install "$DEVICE" build/Build/Products/Debug-iphonesimulator/Brivel.app
          xcrun simctl launch "$DEVICE" io.github.mrclusterman.trainsync
          sleep 8
          mkdir -p screenshots
          xcrun simctl io "$DEVICE" screenshot screenshots/inicio.png
          # Con un perfil y un objetivo de prueba (datos sintéticos): cada pestaña
          xcrun simctl terminate "$DEVICE" io.github.mrclusterman.trainsync
          xcrun simctl spawn "$DEVICE" defaults write io.github.mrclusterman.trainsync trainsync.data -string \
            '{"profile":{"birthYear":1990,"level":"intermediate","strength":"gym","cardio":["walking","running"],"days":{"MON":45,"WED":45,"FRI":45,"SAT":60}},"goal":{"kind":"FITNESS","since":"2026-01-05"},"blockStart":"2026-01-05"}'
          for mode in dark light; do
            xcrun simctl ui "$DEVICE" appearance $mode
            for t in 0 1 2 3; do
              xcrun simctl launch "$DEVICE" io.github.mrclusterman.trainsync -tab $t
              sleep 6
              xcrun simctl io "$DEVICE" screenshot screenshots/pestana-$t-$mode.png
              xcrun simctl terminate "$DEVICE" io.github.mrclusterman.trainsync
            done
          done
      - uses: actions/upload-artifact@v7
        with:
          name: ios-screenshots
          path: iosApp/screenshots/
      # .ipa para iPhone real sin cuenta de desarrollador: lo firma SideStore, AltStore o similar. La firma ad hoc solo
      # lleva los permisos (HealthKit) para que el firmador los pida; sin ella la app llegaría sin Apple Salud.
      - working-directory: iosApp
        run: |
          xcodebuild -project iosApp.xcodeproj -scheme iosApp -sdk iphoneos -configuration Release -derivedDataPath build \
            -destination 'generic/platform=iOS' build CODE_SIGNING_ALLOWED=NO
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/Brivel.app Payload/
          codesign -f -s - --entitlements iosApp/iosApp.entitlements Payload/Brivel.app
          codesign -d --entitlements - Payload/Brivel.app
          zip -qry Brivel.ipa Payload
      - uses: actions/upload-artifact@v7
        with:
          name: trainsync-ipa
          path: iosApp/Brivel.ipa

  prototype:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: prototype/backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.12" }
      - run: pip install "fastapi>=0.111" "uvicorn[standard]>=0.30" "httpx>=0.27" "sqlalchemy>=2.0" "pyjwt>=2.8" "cryptography>=42" "pytest>=8"
      - run: python -m pytest -q
