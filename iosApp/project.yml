# XcodeGen: el proyecto de Xcode se genera en macOS (CI) con `xcodegen`; así no se versiona el .xcodeproj
name: iosApp
options:
  bundleIdPrefix: io.github.mrclusterman
  deploymentTarget:
    iOS: "17.0"
targets:
  iosApp:
    type: application
    platform: iOS
    sources: [iosApp]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.mrclusterman.trainsync
        PRODUCT_NAME: Brivel
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: ""  # el catálogo solo lleva iconos de interfaz; la app aún no tiene icono propio
        EXCLUDED_ARCHS[sdk=iphonesimulator*]: x86_64  # el núcleo solo compila el simulador de Apple Silicon
        INFOPLIST_KEY_NSHealthShareUsageDescription: "Brivel lee tu sueño, tu variabilidad cardíaca, tu pulso en reposo, tu peso, tus pasos y tus entrenamientos para ajustar tu plan y enseñarte tu evolución. Los datos no salen de tu iPhone."
        FRAMEWORK_SEARCH_PATHS: $(SRCROOT)/../shared/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)
        OTHER_LDFLAGS: [-framework, Shared]
    entitlements:
      path: iosApp/iosApp.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
    preBuildScripts:
      - name: Compilar el núcleo compartido (Kotlin)
        script: cd "$SRCROOT/.." && ./gradlew :shared:embedAndSignAppleFrameworkForXcode
        basedOnDependencyAnalysis: false
