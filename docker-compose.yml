# shortcut: solo el backend; PostgreSQL/TimescaleDB, Redis y Celery entran en la Fase 1 (multiusuario)
services:
  backend:
    build: ./backend
    env_file: .env
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
